name: Deploy preview

# Push to the `preview` branch to publish a design preview at
# https://joonlog.github.io/blog-preview/ (noindex, comments off).
on:
    push:
        branches: [preview]

concurrency:
    group: preview
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-go@v5
              with:
                  go-version: "^1.17.0"

            # Keep versions in sync with deploy.yml
            - name: Install Dart Sass
              env:
                  DART_SASS_VERSION: "1.108.2"
              run: |
                  curl -sSL "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" | tar xz -C "${RUNNER_TEMP}"
                  echo "${RUNNER_TEMP}/dart-sass" >> "${GITHUB_PATH}"

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@v3
              with:
                  hugo-version: "0.170.1"

            - name: Generate category pages
              run: go run scripts/generate-categories.go

            - name: Build
              run: hugo --minify --gc --environment preview --baseURL "https://joonlog.github.io/blog-preview/"

            - name: Publish to joonlog/blog-preview
              uses: peaceiris/actions-gh-pages@v4
              with:
                  personal_token: ${{ secrets.PREVIEW_TOKEN }}
                  external_repository: joonlog/blog-preview
                  publish_branch: gh-pages
                  publish_dir: ./public
                  force_orphan: true
